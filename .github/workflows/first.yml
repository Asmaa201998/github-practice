
name: My First Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print a message
        run: echo "Hello! GitHub Actions is working."

      - name: Show repository name
        run: echo "My repository is $GITHUB_REPOSITORY"

      - name: Check secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is configured."
          else
            echo "Secret is missing."
            exit 1
          fi
